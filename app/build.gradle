plugins { id 'com.android.application' }

android {
    namespace 'com.docsviewer'
    compileSdk 35
    defaultConfig {
        applicationId 'com.docsviewer'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.2'
        testInstrumentationRunner 'com.docsviewer.AndroidSmoke'
    }
}

dependencies {
    implementation 'org.commonmark:commonmark:0.27.1'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.27.1'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.27.1'
    implementation 'org.commonmark:commonmark-ext-task-list-items:0.27.1'
    implementation 'org.jsoup:jsoup:1.24.1'
}
